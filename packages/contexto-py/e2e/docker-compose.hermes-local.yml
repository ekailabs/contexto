# Compose override that runs hermes-agent with the local contexto backend.
#
# Pre-req: build the hermes-agent base image once.
#   cd ../../../hermes-agent
#   docker build -t hermes-agent .
#
# Then from the contexto-py root:
#   docker compose -f e2e/docker-compose.hermes-local.yml --env-file e2e/.env up
#
# This wires CONTEXTO_BACKEND=local + OPENROUTER_API_KEY into the gateway, so
# any compress() inside Hermes drives the local mindmap.
#
# Plugin install (active bind mount below): the bundled
# `plugins/context_engine/contexto/` in the hermes-agent repo is an absolute
# symlink into this checkout. Docker's `COPY . .` does NOT follow that to a
# usable file inside the image — it ends up as a broken symlink pointing at a
# host path the container can't see. We bind-mount the source directly onto the
# image's plugin path at runtime so the loader sees the live tree. Read-only
# because the plugin code should not be mutated from inside the container.
#
# Runtime deps (numpy + scipy): the hermes-agent base image does not ship them,
# and the local backend can't be constructed without them — the plugin loader
# logs `No module named 'numpy'` and the gateway silently falls back to the
# built-in compressor. The `sh -c` command below installs both into the image's
# venv before launching `hermes gateway run`. `uv pip install` is idempotent,
# so the step is a fast no-op on restarts. The hermes entrypoint activates
# /opt/hermes/.venv before exec'ing this command, so `uv` and `hermes` are on
# PATH and the install targets the right interpreter. NB: we call `hermes
# gateway run` (not `gateway run`) because the entrypoint's `gateway` → `hermes
# gateway` wrap only fires when `gateway` is the first container arg — inside
# our `sh -c` it isn't, and `gateway` isn't a standalone binary.
# Data dir: defaults to a dedicated scratch dir so the test gateway never
# touches a live ~/.hermes (two gateways sharing state.db / gateway.lock — or
# host-network port collisions with one already running — will corrupt state).
# Opt into your real home only when no host gateway is running:
#   CONTEXTO_E2E_HOME=$HOME/.hermes docker compose -f e2e/docker-compose.hermes-local.yml --env-file e2e/.env up
services:
  gateway:
    image: hermes-agent
    container_name: hermes-contexto-local
    restart: "no"
    network_mode: host
    volumes:
      - ${CONTEXTO_E2E_HOME:-/tmp/hermes-contexto-e2e}:/opt/data
      - ../src/contexto_hermes:/opt/hermes/plugins/context_engine/contexto:ro
    environment:
      - HERMES_UID=${HERMES_UID:-10000}
      - HERMES_GID=${HERMES_GID:-10000}
      - CONTEXTO_BACKEND=local
      - CONTEXTO_LOCAL_PROVIDER=openrouter
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      # Optional tunables — defaults are sensible.
      # - CONTEXTO_LOCAL_SIMILARITY_THRESHOLD=0.65
      # - CONTEXTO_LOCAL_REBUILD_INTERVAL=50
    command:
      - sh
      - -c
      - |
        uv pip install --python /opt/hermes/.venv/bin/python numpy scipy \
          && exec hermes gateway run
